<div class="container py-5">
  <h1 class="text-center mb-4">Contáctanos</h1>
  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-3">Envíanos un mensaje</h4>

          <div *ngIf="exito()" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            ¡Mensaje enviado correctamente!
            <button type="button" class="btn-close" aria-label="Cerrar"
              (click)="cerrarAlerta()"></button>
          </div>

          <form #f="ngForm" (ngSubmit)="enviar(f)">
            <div class="mb-3">
              <label class="form-label" for="nombre">Nombre completo</label>
              <input id="nombre" class="form-control" name="nombre" [(ngModel)]="modelo.nombre" required minlength="3">
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Correo electrónico</label>
              <input id="email" type="email" class="form-control" name="email" [(ngModel)]="modelo.email" required
                email>
            </div>
            <div class="mb-3">
              <label class="form-label" for="asunto">Asunto</label>
              <input id="asunto" class="form-control" name="asunto" [(ngModel)]="modelo.asunto" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="mensaje">Mensaje</label>
              <textarea id="mensaje" class="form-control" name="mensaje" rows="4" [(ngModel)]="modelo.mensaje"
                required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="f.invalid">
              <i class="bi bi-send-fill"></i> Enviar mensaje
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-3">
            <i class="bi bi-inbox"></i> Mensajes recibidos
            <span class="badge bg-primary">{{ mensajes().length }}</span>
          </h4>
          <p class="text-muted" *ngIf="mensajes().length === 0">Aún no hay mensajes registrados.</p>
          <div class="list-group" *ngIf="mensajes().length > 0">
            <div class="list-group-item" *ngFor="let m of mensajes()">
              <div class="d-flex justify-content-between">
                <strong>{{ m.nombre }}</strong>
                <small class="text-muted">{{ m.fecha }}</small>
              </div>
              <small class="text-primary">{{ m.email }}</small>
              <p class="mb-0 mt-1"><strong>{{ m.asunto }}:</strong> {{ m.mensaje }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
