<div class="container py-5">
  <h1 class="text-center mb-4">Categorías de Productos</h1>
  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-3" *ngFor="let c of categorias">
      <div class="card text-center h-100 border-0 shadow-sm card-hover">
        <div class="card-body p-4">
          <i class="bi {{ c.icono }} display-3 text-primary"></i>
          <h4 class="mt-3">{{ c.nombre }}</h4>
          <p class="text-muted">{{ c.descripcion }}</p>
          <a routerLink="/productos" class="btn btn-primary btn-sm">Ver productos</a>
        </div>
      </div>
    </div>
  </div>
</div>
